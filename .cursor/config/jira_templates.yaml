# Jira Templates Configuration
# This file contains templates for Jira comments, ticket descriptions, and other content

# Test Execution Templates
test_execution:
  progress_update: |
    ## Test Execution Progress
    
    **Project:** {project}
    **Test Case:** {test_case_id}
    **Status:** {status}
    **Date:** {date}
    
    **Test Details:**
    - **Priority:** {priority}
    - **Environment:** {environment}
    - **Browser:** {browser}
    - **Execution Time:** {execution_time}
    
    **Results:**
    {results}
    
    **Next Steps:**
    {next_steps}
    
    ---
    *Updated by QA Assistant*
  
  completion_summary: |
    ## Test Execution Complete
    
    **Project:** {project}
    **Total Tests:** {total_tests}
    **Passed:** {passed_tests}
    **Failed:** {failed_tests}
    **Skipped:** {skipped_tests}
    **Coverage:** {coverage}%
    
    **Summary:**
    {summary}
    
    **Critical Issues:**
    {critical_issues}
    
    **Recommendations:**
    {recommendations}
    
    ---
    *Report generated by QA Assistant*

# Bug Report Templates
bug_reports:
  new_bug: |
    ## Bug Report
    
    **Severity:** {severity}
    **Priority:** {priority}
    **Environment:** {environment}
    **Browser:** {browser}
    **Test Case:** {test_case}
    
    **Steps to Reproduce:**
    {steps_to_reproduce}
    
    **Expected Result:**
    {expected_result}
    
    **Actual Result:**
    {actual_result}
    
    **Additional Information:**
    - **Screenshots:** {screenshots}
    - **Logs:** {logs}
    - **Console Errors:** {console_errors}
    
    **Impact:**
    {impact}
    
    ---
    *Reported by QA Assistant*
  
  bug_update: |
    ## Bug Update
    
    **Previous Status:** {previous_status}
    **New Status:** {new_status}
    **Updated By:** {updated_by}
    **Date:** {date}
    
    **Changes:**
    {changes}
    
    **Additional Notes:**
    {notes}
    
    ---
    *Updated by QA Assistant*

# Traceability Templates
traceability:
  coverage_report: |
    ## Requirements Coverage Report
    
    **Project:** {project}
    **Date:** {date}
    
    **Coverage Summary:**
    - **Total Requirements:** {total_requirements}
    - **Covered Requirements:** {covered_requirements}
    - **Coverage Percentage:** {coverage_percentage}%
    
    **Requirements Status:**
    {requirements_status}
    
    **Test Cases Status:**
    - **Total Test Cases:** {total_test_cases}
    - **Passed:** {passed_test_cases}
    - **Failed:** {failed_test_cases}
    - **Not Started:** {not_started_test_cases}
    
    **Coverage Gaps:**
    {coverage_gaps}
    
    **Recommendations:**
    {recommendations}
    
    ---
    *Generated by QA Assistant*
  
  test_case_update: |
    ## Test Case Update
    
    **Test Case:** {test_case_id}
    **Requirement:** {requirement_id}
    **Status:** {status}
    **Date:** {date}
    
    **Test Details:**
    - **Priority:** {priority}
    - **Type:** {test_type}
    - **Environment:** {environment}
    
    **Results:**
    {results}
    
    **Traceability:**
    - **Requirements:** {requirements}
    - **Related Bugs:** {related_bugs}
    - **Coverage:** {coverage}
    
    ---
    *Updated by QA Assistant*

# Status Update Templates
status_updates:
  test_started: |
    ## Test Execution Started
    
    **Project:** {project}
    **Test Phase:** {test_phase}
    **Started By:** {started_by}
    **Date:** {date}
    
    **Test Plan:**
    {test_plan}
    
    **Expected Duration:** {expected_duration}
    
    ---
    *Updated by QA Assistant*
  
  test_completed: |
    ## Test Execution Completed
    
    **Project:** {project}
    **Test Phase:** {test_phase}
    **Completed By:** {completed_by}
    **Date:** {date}
    
    **Final Results:**
    {final_results}
    
    **Summary:**
    {summary}
    
    ---
    *Updated by QA Assistant*

# General Templates
general:
  information_update: |
    ## Information Update
    
    **Type:** {update_type}
    **Date:** {date}
    
    **Details:**
    {details}
    
    **Impact:**
    {impact}
    
    ---
    *Updated by QA Assistant*
  
  note: |
    ## Note
    
    **Date:** {date}
    
    {note_content}
    
    ---
    *Added by QA Assistant*

